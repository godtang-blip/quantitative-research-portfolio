<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-labelledby="title description">
  <title id="title">The stop is touched before the buy order triggers</title>
  <desc id="description">A synthetic low-first path starts at 103, falls to 97 across a stop at 100, rises across an entry at 105 to 111, then closes at 105 without touching the stop again.</desc>
  <rect width="960" height="380" rx="16" fill="#f2f6fa"/>
  <g font-family="sans-serif" fill="#152a40">
    <text x="36" y="43" font-size="26" font-weight="bold">A pre-entry low cannot stop out a new position</text>
    <text x="36" y="72" font-size="15" fill="#405568">Synthetic low-first regression case · Event order shown schematically</text>
    <path d="M70 230H874" stroke="#9e5e25" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="877" y="235" font-size="14" fill="#844a19">Stop 100</text>
    <path d="M70 170H874" stroke="#2c6987" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="877" y="175" font-size="14" fill="#2c6987">Entry 105</text>
    <polyline points="110,194 315,266 498,170" fill="none" stroke="#728497" stroke-width="5" stroke-linejoin="round"/>
    <polyline points="498,170 635,98 835,170" fill="none" stroke="#087368" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="110" cy="194" r="5" fill="#728497"/>
    <circle cx="315" cy="266" r="5" fill="#728497"/>
    <circle cx="498" cy="170" r="7" fill="#087368"/>
    <circle cx="635" cy="98" r="5" fill="#087368"/>
    <circle cx="835" cy="170" r="5" fill="#087368"/>
    <text x="108" y="184" text-anchor="middle" font-size="14">Open 103</text>
    <text x="315" y="290" text-anchor="middle" font-size="14">Low 97 · no position</text>
    <text x="498" y="199" text-anchor="middle" font-size="14">Entry triggers</text>
    <text x="652" y="99" font-size="14">High 111</text>
    <text x="830" y="154" text-anchor="middle" font-size="14">Close 105</text>
    <path d="M36 317h888" stroke="#d4dde6"/>
    <text x="36" y="347" font-size="14" fill="#405568">Source: synthetic inputs in test_low_before_stop_entry_cannot_close_position.</text>
  </g>
</svg>
